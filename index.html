@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --aubergine:#3D1533;
  --plum:#6B2D5C;
  --plum-soft:#8F5480;
  --teal:#1F6F6B;
  --teal-soft:#4E9490;
  --amber:#B8730A;
  --rose:#B23A62;
  --paper:#F7F4F8;
  --card:#FFFFFF;
  --ink:#2A2028;
  --muted:#7A6E78;
  --line:#E3DCE5;
  --grid:#EFE9F0;
}

*{box-sizing:border-box;}
.dnv{
  font-family:'Karla',system-ui,-apple-system,sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  padding-bottom:88px;
  -webkit-font-smoothing:antialiased;
}
.dnv h1,.dnv h2,.dnv h3{font-family:'Fraunces',Georgia,serif;font-weight:600;margin:0;letter-spacing:-0.01em;}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}

/* \u2500\u2500 zaglavlje \u2500\u2500 */
.top{
  position:sticky;top:0;z-index:30;
  background:var(--aubergine);
  color:#fff;
  padding:14px 16px 12px;
  box-shadow:0 1px 0 rgba(0,0,0,.15);
}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{font-family:'Fraunces',serif;font-size:19px;font-weight:600;letter-spacing:-0.02em;}
.brand span{opacity:.55;font-family:'Karla',sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;display:block;margin-top:2px;}
.datum-nav{display:flex;align-items:center;gap:6px;margin-top:12px;}
.dbtn{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
  color:#fff;border-radius:8px;width:34px;height:34px;font-size:16px;
  cursor:pointer;flex-shrink:0;line-height:1;
}
.dbtn:hover{background:rgba(255,255,255,.2);}
.dbtn:disabled{opacity:.3;cursor:default;}
.datum-txt{flex:1;text-align:center;}
.datum-dan{font-family:'Fraunces',serif;font-size:16px;font-weight:600;text-transform:capitalize;}
.datum-sub{font-size:11px;opacity:.6;letter-spacing:.08em;text-transform:uppercase;margin-top:1px;}
.danas-btn{
  background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;
  border-radius:20px;padding:5px 12px;font-size:11px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;font-family:'Karla',sans-serif;
}
.danas-btn:hover{background:rgba(255,255,255,.14);}

/* \u2500\u2500 kartice \u2500\u2500 */
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 0;}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:16px;margin-bottom:12px;
}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;}
.card-t{font-family:'Fraunces',serif;font-size:16px;font-weight:600;}
.eyebrow{
  font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);
}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin:8px 0 0;}

/* \u2500\u2500 prekida\u010Di \u2500\u2500 */
.tog{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:transparent;border:none;padding:9px 0;cursor:pointer;
  font-family:'Karla',sans-serif;font-size:14px;color:var(--ink);
  border-bottom:1px solid var(--grid);
}
.tog:last-child{border-bottom:none;}
.box{
  width:21px;height:21px;border-radius:6px;border:1.5px solid var(--line);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:#fff;padding:0;cursor:pointer;
  transition:background .12s ease,border-color .12s ease;
}
@media (prefers-reduced-motion:reduce){.box{transition:none;}}
.box.on{background:var(--teal);border-color:var(--teal);}
.box svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;}
.tog-l{flex:1;}
.tog-note{font-size:11px;color:var(--muted);display:block;margin-top:1px;}

/* \u2500\u2500 skale \u2500\u2500 */
.skala{margin:14px 0 2px;}
.skala-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;}
.skala-n{font-size:13px;font-weight:600;}
.skala-v{font-size:13px;color:var(--plum);font-weight:600;}
.pips{display:flex;gap:5px;}
.pip{
  flex:1;height:34px;border-radius:7px;border:1px solid var(--line);
  background:#fff;cursor:pointer;font-family:'IBM Plex Mono',monospace;
  font-size:12px;color:var(--muted);
}
.pip:hover{border-color:var(--plum-soft);}
.pip.on{background:var(--plum);border-color:var(--plum);color:#fff;font-weight:600;}
.pip.on-r{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:600;}
.pip.on-t{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600;}

/* \u2500\u2500 polja \u2500\u2500 */
.polje{margin-bottom:12px;}
.lab{
  display:block;font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-bottom:5px;
}
.inp{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  font-family:'IBM Plex Mono',monospace;font-size:15px;background:#fff;color:var(--ink);
}
.inp:focus{outline:2px solid var(--plum);outline-offset:1px;border-color:var(--plum);}
textarea.inp{font-family:'Karla',sans-serif;font-size:14px;resize:vertical;min-height:66px;}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

/* \u2500\u2500 cilj / napredak \u2500\u2500 */
.bar-wrap{margin-top:10px;}
.bar{height:7px;background:var(--grid);border-radius:4px;overflow:hidden;}
.bar-f{height:100%;border-radius:4px;transition:width .3s ease;}
@media (prefers-reduced-motion:reduce){.bar-f{transition:none;}}
.bar-lab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px;}

/* \u2500\u2500 trening \u2500\u2500 */
.tren-tip{
  display:inline-block;padding:4px 10px;border-radius:20px;font-size:10px;
  font-weight:700;letter-spacing:.12em;text-transform:uppercase;
}
.vjezba{
  border-bottom:1px solid var(--grid);padding:11px 0;
}
.vjezba:last-child{border-bottom:none;}
.vj-top{display:flex;align-items:center;gap:10px;}
.vj-n{flex:1;font-size:14px;font-weight:600;}
.vj-s{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
.vj-in{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px;padding-left:31px;}
.mini{
  padding:7px 9px;border:1px solid var(--line);border-radius:7px;
  font-family:'IBM Plex Mono',monospace;font-size:13px;width:100%;background:#FCFBFC;
}
.mini:focus{outline:2px solid var(--teal);outline-offset:1px;}

/* \u2500\u2500 punch card \u2500\u2500 */
.pc{overflow-x:auto;margin:0 -4px;}
.pc table{border-collapse:separate;border-spacing:4px;width:100%;}
.pc th{
  font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);
  text-transform:uppercase;padding-bottom:3px;
}
.pc th.rowh,.pc td.rowh{
  text-align:left;font-size:12px;font-weight:500;color:var(--ink);
  white-space:nowrap;padding-right:8px;text-transform:none;letter-spacing:0;
}
.cellsq{width:100%;height:26px;border-radius:6px;border:1px solid var(--line);background:#fff;}
.cellsq.on{background:var(--teal);border-color:var(--teal);}
.cellsq.today{box-shadow:0 0 0 2px var(--amber);}
.pc-sum{
  display:flex;align-items:baseline;gap:8px;margin-top:16px;
  padding-top:14px;border-top:1px solid var(--grid);
}
.pc-big{font-family:'Fraunces',serif;font-size:34px;font-weight:600;color:var(--plum);line-height:1;}

/* \u2500\u2500 kontrolna karta \u2500\u2500 */
.kk{margin-bottom:6px;}
.kk-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;}
.kk-n{font-size:13px;font-weight:600;}
.kk-v{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px;}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px;}

/* \u2500\u2500 tabovi \u2500\u2500 */
.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:#fff;border-top:1px solid var(--line);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tab{
  flex:1;background:transparent;border:none;cursor:pointer;padding:7px 2px;
  font-family:'Karla',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:4px;
}
.tab.on{color:var(--plum);background:#F5EFF4;}
.tab svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.7;fill:none;}

/* \u2500\u2500 plan (referenca) \u2500\u2500 */
.ref-row{
  display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--grid);font-size:13px;
}
.ref-row:last-child{border-bottom:none;}
.ref-k{flex:0 0 100px;font-weight:600;color:var(--plum);}
.ref-v{flex:1;line-height:1.5;}
.acc{
  width:100%;text-align:left;background:transparent;border:none;cursor:pointer;
  padding:12px 0;font-family:'Fraunces',serif;font-size:15px;font-weight:600;
  color:var(--ink);display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--grid);
}
.acc-body{padding:4px 0 14px;border-bottom:1px solid var(--grid);}
.chev{font-size:13px;color:var(--muted);font-family:'Karla',sans-serif;}
.warn{
  background:#FDF6EC;border:1px solid #EBD9BA;border-radius:10px;
  padding:12px 14px;font-size:12.5px;line-height:1.55;color:#6B4A12;margin-top:12px;
}
.warn b{color:#5A3D0C;}

/* \u2500\u2500 dnevnik proteina \u2500\u2500 */
.plog{margin-top:2px;}
.plog-h{
  display:grid;grid-template-columns:1fr 84px 32px;gap:8px;
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px;
}
.plog-r{display:grid;grid-template-columns:1fr 84px 32px;gap:8px;margin-bottom:7px;align-items:center;}
.del{
  border:1px solid var(--line);background:#fff;border-radius:7px;height:33px;
  color:var(--muted);font-size:17px;cursor:pointer;line-height:1;padding:0;
}
.del:hover{border-color:var(--rose);color:var(--rose);}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.chip{
  border:1px solid var(--line);background:#FCFBFC;border-radius:20px;
  padding:6px 11px;font-family:'Karla',sans-serif;font-size:11.5px;
  color:var(--muted);cursor:pointer;
}
.chip b{color:var(--plum);font-family:'IBM Plex Mono',monospace;font-size:11px;}
.chip:hover{border-color:var(--plum-soft);background:#F7F2F6;}

/* \u2500\u2500 \u010Da\u0161e vode \u2500\u2500 */
.case{display:flex;flex-wrap:wrap;gap:6px;}
.casa{
  width:38px;height:44px;border:none;background:transparent;padding:0;cursor:pointer;
}
.casa svg{
  width:100%;height:100%;fill:#fff;stroke:var(--line);stroke-width:1.4;
  stroke-linejoin:round;transition:fill .15s ease,stroke .15s ease;
}
.casa.on svg{fill:var(--teal-soft);stroke:var(--teal);}
.casa:hover svg{stroke:var(--teal);}
@media (prefers-reduced-motion:reduce){.casa svg{transition:none;}}

/* \u2500\u2500 stanje spremanja \u2500\u2500 */
.stanje{border-radius:10px;font-size:12.5px;line-height:1.55;margin-bottom:12px;}
.stanje.ok{
  background:#EAF3F2;border:1px solid #C4DEDB;color:#1A5A56;
  padding:8px 12px;display:flex;align-items:center;gap:8px;font-weight:500;
}
.stanje .tocka{width:7px;height:7px;border-radius:50%;background:var(--teal);flex-shrink:0;}
.stanje.ne{background:#FBECEF;border:1px solid #EFC9D3;color:#7A2338;padding:14px 16px;}
.stanje-n{font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin-bottom:6px;}
.stanje.ne p{margin:0 0 8px;}
.stanje.ne b{color:#5E1A2B;}

.btn{
  padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:#fff;
  font-family:'Karla',sans-serif;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);
}
.btn:hover{background:#FAF8FA;border-color:var(--plum-soft);}
.btn-p{background:var(--plum);border-color:var(--plum);color:#fff;}
.btn-p:hover{background:var(--aubergine);border-color:var(--aubergine);}
.saved{font-size:11px;color:var(--teal);font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
.empty{text-align:center;padding:32px 16px;color:var(--muted);font-size:13px;line-height:1.6;}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--plum);outline-offset:2px;}
